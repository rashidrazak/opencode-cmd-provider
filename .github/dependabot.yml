version: 2
updates:
  # Runtime and dev dependencies. Majors stay ungrouped so they are reviewed on
  # their own — every release of this package runs the full suite, and a major
  # bump is the most likely to need a code change alongside it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # `@opencode-ai/plugin` depends on `zod@4.1.8` exactly, so `zod` cannot
    # float: raising it installs a second copy and `tsc` fails on the tool
    # schema (its `$ZodType` carries the exact version, so the host's copy and
    # ours stop being assignable). Bump it by hand in the PR that moves the
    # upstream requirement, never on its own. (`solid-js` used to sit here too;
    # `@opentui/solid` 0.8.0 widened its peer to `^1.9.12`, and its nested
    # `babel-preset-solid@1.9.16` peer-requires `^1.9.16`, so package.json
    # declares that narrower floor and rides with the group —
    # tests/dependency-pins.test.ts keeps the containment and single-copy
    # guards.)
    ignore:
      - dependency-name: "zod"

  # Third-party Actions are pinned to immutable commit SHAs in the workflows;
  # without these updates a pinned Action never receives upstream patches.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
