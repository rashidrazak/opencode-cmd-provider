name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify tag commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Land the version bump and CHANGELOG entry on main first, then re-tag."
            exit 1
          fi

      - name: Verify tag matches package.json version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Refresh catalog snapshot
        run: npm run refresh:snapshot

      - name: Fail on stale catalog snapshot or facts
        run: |
          if git diff --exit-code -- src/catalog/snapshot.ts && git diff -I 'FACTS_LAST_REFRESHED' --exit-code -- src/catalog/facts.ts; then
            echo "catalog snapshot and facts are fresh"
          else
            echo "::error::catalog snapshot or capability facts are stale. Run 'npm run refresh:snapshot' locally, commit src/catalog/snapshot.ts and src/catalog/facts.ts, land them on main, then re-tag ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Extract changelog entry
        id: notes
        run: |
          version="$(node -p "require('./package.json').version")"
          pattern="$(printf '%s' "$version" | sed 's/\./\\./g')"
          awk -v re="^## ${pattern} - " '
            $0 ~ re { found = 1 }
            found && $0 ~ /^## / && $0 !~ re { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ -s /tmp/release-notes.md ]; then
            echo "has-notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        run: |
          npm install -g npm@latest
          version="$(node -p "require('./package.json').version")"
          publish_args=""
          if [[ "$version" == *-* ]]; then
            publish_args="--tag beta"
          fi
          npm publish ${publish_args}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.notes.outputs.has-notes }}" = "true" ]; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
