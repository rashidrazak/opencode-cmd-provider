name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Verify tag matches package.json version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - run: npm test
      - run: npm run build

      - name: Fail if catalog snapshot is stale
        run: |
          npm run refresh:snapshot
          if ! git diff --exit-code -- src/catalog/snapshot.ts; then
            echo "::error::catalog snapshot is stale. Run 'npm run refresh:snapshot' locally, commit the change, and re-tag."
            exit 1
          fi

      - name: Extract changelog entry
        id: notes
        run: |
          version="$(node -p "require('./package.json').version")"
          pattern="$(printf '%s' "$version" | sed 's/\./\\./g')"
          awk -v re="^## ${pattern} - " '
            $0 ~ re { found = 1 }
            found && $0 ~ /^## / && $0 !~ re { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ -s /tmp/release-notes.md ]; then
            echo "has-notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          publish_args=""
          if [[ "$version" == *-* ]]; then
            publish_args="--tag beta"
          fi
          if curl -fsSI "https://api.github.com/repos/${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            publish_args="${publish_args} --provenance"
          else
            echo "::warning::repo is private; --provenance requires a public repository, skipping it"
          fi
          npm publish ${publish_args}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.notes.outputs.has-notes }}" = "true" ]; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi