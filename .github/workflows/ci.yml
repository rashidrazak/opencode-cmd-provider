name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      # GitHub's own secret scanning covers partner patterns and blocks pushes
      # that carry one. Command Code's key format is not a partner pattern, so
      # `.secretlintrc.json` adds exactly that one shape — no generic heuristic,
      # which is what makes the gate quiet on the credential-shaped fixtures in
      # `tests/` (allowlisted by value there).
      - run: npm run lint:secrets