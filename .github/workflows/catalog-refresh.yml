name: Catalog refresh

# Daily cron that regenerates the model snapshot + deals catalogs and
# opens a "catalog refresh" PR when the generated files drift from
# `main`. The PR body is the Markdown summary produced by
# `scripts/diff-catalog.mjs` (ticket #84), so a reviewer can tell at a
# glance what changed and decide whether to merge in one click.
#
# Triggered by:
#   - schedule: 06:00 UTC every day (the maintainer observes the first
#     few scheduled runs manually before trusting auto-merge).
#   - workflow_dispatch: manual run from the Actions tab, used to
#     validate changes to this workflow and to refresh on demand.
#
# The workflow does not modify the release pipeline's stale-snapshot
# gate (`.github/workflows/release.yml` / ADR 0003) — that gate is
# unchanged. This workflow is a "best-effort freshness" mechanism per
# the wayfinder spec at #77.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# `contents: write` is needed to push the catalog-refresh branch back
# to the repo. `pull-requests: write` is needed to open the PR. The
# GITHUB_TOKEN is scoped to this workflow — it can't touch anything
# outside the repo.
permissions:
  contents: write
  pull-requests: write

# Serialise runs so a slow daily run can't be superseded by a manual
# dispatch (or vice versa) and race the branch push. The
# `cancel-in-progress: false` is intentional — overlapping runs would
# only ever happen by accident, and cancelling a partially completed
# refresh in favour of a new one is worse than letting the old one
# finish (the old run already pushed nothing).
concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh catalog and open PR if drift detected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 so `git diff` against main can resolve the
          # merge-base (used for the file-level diff in the PR body)
          # and so the branch we push carries the full history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # bun is on PATH because the TUI bundle (`scripts/build-tui.ts`)
      # is bun-only (see AGENTS.md). The cron builds before testing:
      # `npm test` includes a contract test that asserts `npm pack`
      # contains `dist/tui.js`, and a fresh checkout has no `dist/`
      # (it is gitignored) — the "pre-existing dist/tui.js
      # test-isolation failure" was exactly that: the cron never ran
      # the build. Building also typechecks the regenerated catalogs.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      # `npm run refresh` runs `refresh:snapshot` (live fetch),
      # `refresh:fixtures` (re-captures the committed RSC fixtures from
      # the live docs pages — all-or-nothing, loud on any failure), then
      # `refresh:deals -- --fixtures` (regenerates the catalog from the
      # freshly captured fixtures, so fixtures, catalog, and the unit
      # tests stay in lockstep — the coverage gate can never report a
      # snapshot model the fixtures don't carry). A network failure in
      # the snapshot fetch, or a shape-pin failure in any script,
      # surfaces as a non-zero exit — the workflow fails loudly
      # (acceptance criterion: "parser error, network failure, schema
      # mismatch → exit non-zero with a clearly-attributed error
      # message").
      - name: Regenerate catalogs
        run: npm run refresh

      # Build (tsc + bun TUI bundle) before testing: the pack contract
      # test needs dist/tui.js present, and typechecking the regenerated
      # catalogs is a free extra gate.
      - name: Build
        run: npm run build

      # The test suite is the next gate. The schedule is observed
      # manually before auto-merge is enabled, so a flaky-looking test
      # will be caught and triaged before the cron can ship a bad PR.
      - name: Run test suite
        run: npm test

      # Diff detection. The generated files live on the working tree
      # after `npm run refresh`. If they match `main`, exit 0 and
      # open no PR (acceptance criterion: "no PR opened when nothing
      # drifted"). The generated classification module
      # (src/catalog/classification.ts, issue #111) rides the same
      # detection and commit lists, so classification changes actually
      # ship in refresh PRs rather than floating uncommitted.
      - name: Detect drift against main
        id: drift
        run: |
          git fetch origin main
          if git diff --quiet origin/main -- \
              src/catalog/snapshot.ts \
              src/catalog/facts.ts \
              src/catalog/classification.ts \
              src/deals/catalog.ts \
              tests/fixtures/rsc-pricing-limits.txt \
              tests/fixtures/rsc-goat.txt \
              tests/fixtures/rsc-pro.txt; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No catalog drift detected against main — exiting without opening a PR."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "Catalog drift detected — will open a refresh PR."
            git diff --stat origin/main -- \
              src/catalog/snapshot.ts \
              src/catalog/facts.ts \
              src/catalog/classification.ts \
              src/deals/catalog.ts \
              tests/fixtures/rsc-pricing-limits.txt \
              tests/fixtures/rsc-goat.txt \
              tests/fixtures/rsc-pro.txt
          fi

      # Commit the regenerated files. Authored by the GitHub Actions
      # bot so the commit trail is unambiguous.
      - name: Commit regenerated catalog
        if: steps.drift.outputs.drift == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/catalog/snapshot.ts src/catalog/facts.ts src/catalog/classification.ts \
              src/deals/catalog.ts \
              tests/fixtures/rsc-pricing-limits.txt tests/fixtures/rsc-goat.txt \
              tests/fixtures/rsc-pro.txt
          date="$(date -u +%Y-%m-%d)"
          git commit -m "chore: catalog refresh — ${date}"

      # Build the PR body. The snapshot and deals diffs are produced
      # separately so each section's drift is its own Markdown
      # block; the FACTS_LAST_REFRESHED and DEAL_LAST_REFRESHED
      # dates are surfaced inline by `diff-catalog.mjs` (ticket
      # #84).
      #
      # The data extraction uses `tsx` (already in devDependencies)
      # to import the generated `.ts` files and `JSON.stringify`
      # their data portion. The shape of each module's exports is
      # stable: the generator only adds fields, never renames or
      # removes them. The "before" data is captured from
      # `origin/main` before any regeneration; the "after" data is
      # captured from the working tree (post-refresh, post-commit).
      - name: Build PR body from catalog diff
        if: steps.drift.outputs.drift == 'true'
        run: |
          set -euo pipefail

          # The capture step writes one JSON file per catalog
          # (snapshot / facts / deals). The snapshot kind in
          # `diff-catalog.mjs` only consumes `MODEL_SNAPSHOT`; the
          # `date` for snapshot diffs comes from
          # `FACTS_LAST_REFRESHED` (exported from `facts.ts`, not
          # `snapshot.ts`). Same for deals: the data lives in
          # `deals/catalog.ts`; the date in the same file.
          extract() {
            local ts_path="$1"
            local out_path="$2"
            if [ ! -f "${ts_path}" ]; then
              printf '{"missing":true}\n' > "${out_path}"
              return
            fi
            # `tsx` runs the .ts file as a script. The catalog
            # modules have top-level `export const` declarations
            # but no side effects, so we wrap with a dynamic
            # import and JSON.stringify the relevant exports.
            # The output always includes any *-LAST_REFRESHED
            # date the module exports (so the snapshot's
            # FACTS_LAST_REFRESHED, which lives in facts.ts, is
            # captured here even when MODEL_SNAPSHOT is absent).
            #
            # The path must be absolute (or a `file://` URL): a
            # bare-relative `src/catalog/snapshot.ts` is parsed
            # by Node's ESM resolver as a package name, so the
            # import fails with `ERR_MODULE_NOT_FOUND: Cannot
            # find package 'src'` (this bit the workflow on
            # run 33241830819 — the "after" loop was the first
            # to reach this branch, because earlier failures
            # in `npm test` short-circuited before it). The
            # seam is locked down by
            # `tests/catalog-refresh-extract.test.ts`, which
            # spawns this exact heredoc against a bare-relative
            # fixture.
            abs_ts_path="$(realpath "${ts_path}")"
            npx tsx --input-type=module -e "
              const mod = await import(${abs_ts_path@Q});
              const out = {};
              if (mod.MODEL_SNAPSHOT) out.MODEL_SNAPSHOT = mod.MODEL_SNAPSHOT;
              if (mod.MODEL_DEALS)    out.MODEL_DEALS    = mod.MODEL_DEALS;
              if (mod.FACTS_LAST_REFRESHED) out.FACTS_LAST_REFRESHED = mod.FACTS_LAST_REFRESHED;
              if (mod.DEAL_LAST_REFRESHED)  out.DEAL_LAST_REFRESHED  = mod.DEAL_LAST_REFRESHED;
              process.stdout.write(JSON.stringify(out));
            " > "${out_path}" 2>extract-err.txt
            if [ ! -s "${out_path}" ]; then
              echo "::error::failed to extract ${ts_path} — see extract-err.txt"
              cat extract-err.txt
              exit 1
            fi
          }

          # 1) Capture the "before" state from origin/main
          #    (read-only checkout via `git show`).
          mkdir -p /tmp/before
          for f in src/catalog/snapshot.ts src/catalog/facts.ts src/deals/catalog.ts; do
            base="$(basename "${f}" .ts)"
            if git show "origin/main:${f}" > "/tmp/before/${base}.ts" 2>/dev/null; then
              extract "/tmp/before/${base}.ts" "/tmp/before/${base}.json"
            else
              printf '{"missing":true}\n' > "/tmp/before/${base}.json"
            fi
          done

          # 2) Capture the "after" state from the working tree
          #    (post-refresh, post-commit).
          mkdir -p /tmp/after
          for f in src/catalog/snapshot.ts src/catalog/facts.ts src/deals/catalog.ts; do
            base="$(basename "${f}" .ts)"
            extract "${f}" "/tmp/after/${base}.json"
          done

          # 3) Compose the PR body. The "before" file may be
          #    missing (the first run, or a brand-new generated
          #    file); `diff-catalog.mjs` falls through to a
          #    "no changes" / "first refresh" message in that
          #    case.
          date="$(date -u +%Y-%m-%d)"
          {
            echo "## Catalog refresh — ${date}"
            echo ""
            echo "Automated refresh of the generated catalog files. Review the file-level diff below before merging."
            echo ""
            echo "### Changed files"
            echo ""
            echo '```'
            git diff --stat origin/main -- src/catalog/snapshot.ts src/catalog/facts.ts src/deals/catalog.ts
            echo '```'
            echo ""
            echo "### Model catalog"
            echo ""
            before_date="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/before/facts.json','utf-8')).FACTS_LAST_REFRESHED ?? ''" 2>/dev/null || true)"
            after_date="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/after/facts.json','utf-8')).FACTS_LAST_REFRESHED ?? ''" 2>/dev/null || true)"
            node scripts/diff-catalog.mjs snapshot /tmp/before/snapshot.json /tmp/after/snapshot.json \
              --before-date "${before_date}" --after-date "${after_date}" \
              || echo "_snapshot diff unavailable_"
            echo ""
            echo "### Deals intelligence"
            echo ""
            before_date="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/before/deals.json','utf-8')).DEAL_LAST_REFRESHED ?? ''" 2>/dev/null || true)"
            after_date="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/after/deals.json','utf-8')).DEAL_LAST_REFRESHED ?? ''" 2>/dev/null || true)"
            node scripts/diff-catalog.mjs deals /tmp/before/deals.json /tmp/after/deals.json \
              --before-date "${before_date}" --after-date "${after_date}" \
              || echo "_deals diff unavailable_"
            echo ""
            echo "---"
            echo ""
            echo "_Auto-generated by the \`catalog-refresh\` workflow. Review and merge._"
          } > pr-body.md
          echo "----- pr-body.md -----"
          cat pr-body.md

      - name: Push branch
        if: steps.drift.outputs.drift == 'true'
        run: |
          date="$(date -u +%Y-%m-%d)"
          branch="catalog-refresh/${date}"
          git checkout -b "${branch}"
          # Force-push so a re-run after a partial failure (e.g.
          # a previous run that pushed the branch but failed at
          # `Open PR`) doesn't reject this push as non-fast-forward
          # — both runs sit on the same `main` HEAD, so the local
          # commit is a sibling of the previous tip, not a
          # descendant. `-u` is preserved for the first push so
          # the upstream tracking is set; on a re-run `-f` wins
          # and overwrites the existing tip. The branch is
          # `catalog-refresh/${date}` and only this workflow
          # creates it, so there's no risk of clobbering a
          # maintainer's work. (Run 33245295616 hit this when the
          # previous run's `1d1e96c` was already on the remote
          # and the new local commit could not fast-forward it.)
          git push -fu origin "${branch}"

      - name: Open PR
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date="$(date -u +%Y-%m-%d)"
          branch="catalog-refresh/${date}"
          # If a PR for this branch already exists (e.g. a
          # re-run after a partial failure), update its body
          # rather than opening a duplicate.
          existing="$(gh pr list --head "${branch}" --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            echo "PR #${existing} for ${branch} already exists; updating body."
            gh pr edit "${existing}" --body-file pr-body.md
            exit 0
          fi
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore: catalog refresh — ${date}" \
            --body-file pr-body.md
